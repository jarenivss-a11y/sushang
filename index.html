<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code Skills - 技能库</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --paper: #faf6f0;
            --ink: #2d2a26;
            --ink-light: #5c574e;
            --pencil: #8b7355;
            --highlight: #fff3b0;
            --accent-blue: #5b8dd9;
            --accent-pink: #e8a4b8;
            --accent-green: #7cb386;
            --accent-orange: #e8a862;
            --accent-purple: #9b8ec4;
            --border: #d4cdc4;
        }

        body {
            font-family: 'Nunito', -apple-system, sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
            background-image:
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h100v100H0z' fill='none'/%3E%3Cpath d='M50 50m-1 0a1 1 0 1 0 2 0a1 1 0 1 0-2 0' fill='%23d4cdc4'/%3E%3C/svg%3E");
            background-size: 20px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Hand-drawn border effect */
        .hand-border {
            position: relative;
        }
        .hand-border::before {
            content: '';
            position: absolute;
            inset: -3px;
            background: var(--ink);
            border-radius: inherit;
            z-index: -1;
            transform: translate(2px, 2px);
        }

        header {
            text-align: center;
            margin-bottom: 48px;
            position: relative;
        }

        .header-decoration {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 30px;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--ink);
            position: relative;
            display: inline-block;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            height: 8px;
            background: var(--highlight);
            z-index: -1;
            transform: skewX(-3deg);
        }

        .subtitle {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--ink-light);
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-top: 24px;
        }

        .stat {
            text-align: center;
            background: white;
            padding: 16px 28px;
            border-radius: 16px;
            border: 2px solid var(--ink);
            box-shadow: 4px 4px 0 var(--ink);
            position: relative;
        }

        .stat::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: -4px;
            bottom: -4px;
            background: var(--accent-orange);
            border-radius: 16px;
            z-index: -1;
        }

        .stat-value {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--ink-light);
        }

        .search-bar {
            max-width: 500px;
            margin: 0 auto 32px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 16px 24px;
            border-radius: 30px;
            border: 2px solid var(--ink);
            background: white;
            color: var(--ink);
            font-size: 1rem;
            font-family: 'Nunito', sans-serif;
            outline: none;
            box-shadow: 4px 4px 0 var(--ink);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-bar input:focus {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 var(--ink);
        }

        .search-bar input::placeholder {
            color: var(--pencil);
            font-style: italic;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid var(--ink);
            background: white;
            color: var(--ink);
            font-size: 0.9rem;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 3px 3px 0 var(--ink);
        }

        .filter-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--ink);
        }

        .filter-btn.active {
            background: var(--ink);
            color: white;
            box-shadow: 3px 3px 0 var(--pencil);
        }

        .category-section {
            margin-bottom: 48px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 3px dashed var(--border);
        }

        .category-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 3px solid var(--ink);
            background: white;
            box-shadow: 4px 4px 0 var(--ink);
        }

        .category-title {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            font-weight: 600;
        }

        .category-count {
            background: var(--highlight);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 600;
            border: 2px solid var(--ink);
            margin-left: auto;
        }

        .skill-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            border: 2px solid var(--ink);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 4px 4px 0 var(--ink);
            position: relative;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            background: var(--accent-pink);
            border-radius: 50%;
            opacity: 0.6;
        }

        .skill-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 var(--ink);
        }

        .skill-card:hover::before {
            animation: bounce 0.5s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .skill-name {
            font-family: 'Caveat', cursive;
            font-weight: 600;
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: var(--ink);
        }

        .skill-desc {
            font-size: 0.9rem;
            color: var(--ink-light);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .skill-tags {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .skill-tag {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.75rem;
            background: var(--highlight);
            color: var(--ink);
            border: 1px solid var(--pencil);
            font-weight: 500;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(45, 42, 38, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--paper);
            border-radius: 24px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border: 3px solid var(--ink);
            box-shadow: 8px 8px 0 var(--ink);
        }

        .modal-header {
            padding: 28px;
            border-bottom: 2px dashed var(--border);
            position: relative;
            background: white;
        }

        .modal-title {
            font-family: 'Caveat', cursive;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-category-badge {
            display: inline-block;
            background: var(--accent-green);
            color: white;
            padding: 4px 16px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 2px solid var(--ink);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--accent-pink);
            border: 2px solid var(--ink);
            color: var(--ink);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            font-family: 'Caveat', cursive;
            box-shadow: 3px 3px 0 var(--ink);
            transition: all 0.2s;
        }

        .modal-close:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 var(--ink);
        }

        .modal-body {
            padding: 28px;
        }

        .modal-section {
            margin-bottom: 24px;
        }

        .modal-section h3 {
            font-family: 'Caveat', cursive;
            font-size: 1.5rem;
            color: var(--ink);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-section h3::before {
            content: '✏️';
            font-size: 1.2rem;
        }

        .skill-full-desc {
            line-height: 1.7;
            color: var(--ink);
            font-size: 1.05rem;
        }

        .skill-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .meta-item {
            background: white;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink);
        }

        .meta-label {
            font-size: 0.75rem;
            color: var(--pencil);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-value {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .modal-footer {
            padding: 20px 28px;
            background: var(--highlight);
            border-top: 2px dashed var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-note {
            font-size: 0.85rem;
            color: var(--ink-light);
            font-style: italic;
        }

        .footer-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--ink-light);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--accent-blue);
            text-decoration: none;
        }

        /* Hand-drawn underlines for links */
        .hand-link {
            position: relative;
            text-decoration: none;
        }
        .hand-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent-orange);
            transform: skewX(-5deg);
        }

        /* Decorations */
        .decoration {
            position: fixed;
            font-size: 2rem;
            opacity: 0.15;
            pointer-events: none;
        }
        .dec-1 { top: 10%; left: 5%; transform: rotate(-15deg); }
        .dec-2 { top: 30%; right: 5%; transform: rotate(10deg); }
        .dec-3 { bottom: 20%; left: 8%; transform: rotate(-5deg); }
        .dec-4 { bottom: 10%; right: 10%; transform: rotate(15deg); }

        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            .stats { gap: 16px; flex-wrap: wrap; }
            .stat { padding: 12px 20px; }
            .stat-value { font-size: 2rem; }
            .category-title { font-size: 1.6rem; }
            .category-icon { width: 50px; height: 50px; font-size: 1.5rem; }
            .filters { gap: 8px; }
            .filter-btn { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>

                    { name: "systematic-debugging", desc: "系统调试：使用假设驱动的调查、日志分析和二分法隔离缺陷", version: "-" },
                    { name: "skills-org-webapp-testing", desc: "Web 测试：使用 Playwright 验证前端功能、调试 UI", version: "-" },
                    { name: "web-artifacts-builder", desc: "Web 组件构建：创建复杂的 React/HTML 组件", version: "-" }
                ]
            }
        };

        let currentFilter = 'all';
        let searchTerm = '';

        function renderSkills() {
            const container = document.getElementById('skillsContainer');
            container.innerHTML = '';
            let totalCount = 0;

            for (const [category, data] of Object.entries(skills)) {
                if (currentFilter !== 'all' && category !== currentFilter) continue;

                const filteredItems = data.items.filter(item =>
                    item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    item.desc.toLowerCase().includes(searchTerm.toLowerCase())
                );

                if (filteredItems.length === 0 && searchTerm) continue;
                totalCount += filteredItems.length;

                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `
                    <div class="category-header">
                        <div class="category-icon">${data.icon}</div>
                        <div class="category-title">${category}</div>
                        <div class="category-count">${filteredItems.length} 个</div>
                    </div>
                    <div class="skill-grid">
                        ${filteredItems.map(item => `
                            <div class="skill-card" onclick="openModal('${category}', '${item.name}')">
                                <div class="skill-name">${item.name}</div>
                                <div class="skill-desc">${item.desc}</div>
                                <div class="skill-tags">
                                    ${item.version ? `<span class="skill-tag">v${item.version}</span>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            }

            document.getElementById('totalCount').textContent = totalCount;
        }

        function openModal(category, skillName) {
            const data = skills[category].items.find(i => i.name === skillName);
            if (!data) return;

            document.getElementById('modalTitle').textContent = data.name;
            document.getElementById('modalCategory').textContent = category;
            document.getElementById('modalBody').innerHTML = `
                <div class="modal-section">
                    <h3>技能描述</h3>
                    <div class="skill-full-desc">${data.desc}</div>
                </div>
                <div class="modal-section">
                    <h3>元信息</h3>
                    <div class="skill-meta">
                        <div class="meta-item">
                            <div class="meta-label">分类</div>
                            <div class="meta-value">${category}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">版本</div>
                            <div class="meta-value">${data.version || '-'}</div>
                        </div>
                        <div class="meta-item">
                            <div class="meta-label">存储路径</div>
                            <div class="meta-value" style="font-size: 0.8rem; word-break: break-all;">skills-repo/${category}/${data.name}</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderSkills();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderSkills();
            });
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        renderSkills();
    </script>
</body>
</html>
